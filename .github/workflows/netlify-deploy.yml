name: Deploy to Netlify

on:
  push:
    branches:
      - claude/luxury-ecommerce-design-jt3IU
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 4f3ef7d3-5f11-4604-8c6b-119829432258
        run: npx netlify-cli deploy --dir=.next --prod --message="Deploy from GitHub Actions"
