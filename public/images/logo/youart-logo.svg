<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="You Art Lac Rose">
  <!-- White circle background -->
  <circle cx="110" cy="110" r="108" fill="white"/>

  <!-- ── PIROGUE (pink-red boat, bottom) ── -->
  <path d="M 28 118 Q 110 140 192 118 L 185 128 Q 110 152 35 128 Z" fill="#D42B3A"/>

  <!-- ── YELLOW SAIL (center triangle) ── -->
  <polygon points="108,22 74,118 142,118" fill="#F5C200"/>

  <!-- ── GREEN CAMEL (left) ── -->
  <!-- Neck body -->
  <path d="M 44 108 C 38 90 34 72 42 56 C 46 48 52 44 54 50 C 56 56 52 64 50 76 C 48 88 52 100 56 108 Z" fill="#2E7D32"/>
  <!-- Head -->
  <ellipse cx="44" cy="50" rx="16" ry="13" fill="#2E7D32"/>
  <!-- Snout -->
  <ellipse cx="30" cy="56" rx="10" ry="7" fill="#388E3C"/>
  <!-- Nostril bump -->
  <ellipse cx="22" cy="57" rx="5" ry="3.5" fill="#2E7D32"/>
  <!-- Eye -->
  <circle cx="40" cy="45" r="3" fill="white"/>
  <circle cx="40" cy="45" r="1.6" fill="#1A1A1A"/>
  <!-- Ear -->
  <ellipse cx="54" cy="40" rx="5" ry="7" fill="#388E3C" transform="rotate(-15 54 40)"/>
  <!-- Hump hint -->
  <ellipse cx="58" cy="76" rx="10" ry="7" fill="#2E7D32"/>

  <!-- ── RED QUAD (right) ── -->
  <!-- Main body -->
  <rect x="118" y="72" width="52" height="32" rx="5" fill="#D32F2F"/>
  <!-- Front nose -->
  <rect x="162" y="76" width="16" height="24" rx="4" fill="#B71C1C"/>
  <!-- Seat / top -->
  <rect x="122" y="64" width="36" height="14" rx="4" fill="#C62828"/>
  <!-- Handlebars -->
  <path d="M 162 68 L 172 58 M 172 58 L 178 58" stroke="#8B0000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 162 68 L 168 60" stroke="#8B0000" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Rear wheel -->
  <circle cx="130" cy="108" r="14" fill="#1A1A1A"/>
  <circle cx="130" cy="108" r="9" fill="#F5C200"/>
  <circle cx="130" cy="108" r="4" fill="#1A1A1A"/>
  <!-- Front wheel -->
  <circle cx="170" cy="108" r="12" fill="#1A1A1A"/>
  <circle cx="170" cy="108" r="7.5" fill="#F5C200"/>
  <circle cx="170" cy="108" r="3" fill="#1A1A1A"/>
  <!-- Wheel spokes rear -->
  <line x1="130" y1="99" x2="130" y2="117" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="121" y1="108" x2="139" y2="108" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Wheel spokes front -->
  <line x1="170" y1="100.5" x2="170" y2="115.5" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="162.5" y1="108" x2="177.5" y2="108" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ── TEXT ── -->
  <text x="110" y="164" text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="34" font-weight="900" fill="#111111" letter-spacing="1.5">YOU ART</text>
  <text x="110" y="187" text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="19" font-weight="900" fill="#111111" letter-spacing="5">LAC ROSE</text>
</svg>
