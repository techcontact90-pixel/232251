<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="You Art Lac Rose">

  <!-- ── PIROGUE (pink-red curved boat, bottom of icon) ── -->
  <path d="M 55 228 Q 100 252 200 258 Q 300 258 355 228 L 348 240 Q 290 268 200 270 Q 110 268 52 240 Z" fill="#E8637A"/>

  <!-- ── YELLOW SAIL (tall triangle, center) ── -->
  <polygon points="198,52 148,235 248,235" fill="#F5C200"/>

  <!-- ── GREEN CAMEL (left, facing left) ── -->
  <!-- Neck -->
  <path d="M 100 232 C 90 210 80 185 85 158 C 88 143 96 135 106 140 C 116 145 114 162 110 180 C 106 198 108 218 112 232 Z" fill="#4CAF50"/>
  <!-- Head -->
  <ellipse cx="86" cy="148" rx="30" ry="23" fill="#4CAF50" transform="rotate(-10 86 148)"/>
  <!-- Snout extension -->
  <path d="M 58 155 Q 44 162 46 172 Q 48 182 62 180 Q 76 178 82 165 Z" fill="#66BB6A"/>
  <!-- Nostril bump -->
  <ellipse cx="47" cy="172" rx="7" ry="5" fill="#4CAF50"/>
  <!-- Eye -->
  <circle cx="78" cy="139" r="5.5" fill="white"/>
  <circle cx="77" cy="139" r="3" fill="#1A1A1A"/>
  <circle cx="76" cy="138" r="1" fill="white"/>
  <!-- Ear -->
  <ellipse cx="108" cy="126" rx="7" ry="10" fill="#66BB6A" transform="rotate(-20 108 126)"/>
  <!-- Hump suggestion on neck -->
  <ellipse cx="114" cy="170" rx="13" ry="9" fill="#4CAF50"/>

  <!-- ── RED QUAD (right side) ── -->
  <!-- Rear wheel -->
  <circle cx="248" cy="228" r="22" fill="rgba(0,0,0,0.5)"/>
  <circle cx="248" cy="228" r="14" fill="#F5C200"/>
  <circle cx="248" cy="228" r="6" fill="rgba(0,0,0,0.6)"/>
  <line x1="248" y1="214" x2="248" y2="242" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
  <line x1="234" y1="228" x2="262" y2="228" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>

  <!-- Main body -->
  <rect x="242" y="158" width="88" height="56" rx="8" fill="#EF5350"/>
  <!-- Front fairing -->
  <rect x="312" y="164" width="30" height="44" rx="6" fill="#E53935"/>
  <!-- Seat / top -->
  <rect x="250" y="144" width="70" height="20" rx="5" fill="#E57373"/>
  <!-- Fender -->
  <path d="M 240 158 Q 248 148 260 152 L 256 162 Z" fill="#E53935"/>

  <!-- Handlebars -->
  <path d="M 310 154 Q 314 136 320 126" stroke="#B71C1C" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 316 128 L 330 124 M 316 128 L 306 124" stroke="#B71C1C" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Front wheel -->
  <circle cx="328" cy="222" r="20" fill="rgba(0,0,0,0.5)"/>
  <circle cx="328" cy="222" r="13" fill="#F5C200"/>
  <circle cx="328" cy="222" r="5" fill="rgba(0,0,0,0.6)"/>
  <line x1="328" y1="209" x2="328" y2="235" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
  <line x1="315" y1="222" x2="341" y2="222" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>

  <!-- ── TEXT white ── -->
  <text x="200" y="316"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="60"
    font-weight="900"
    fill="white"
    letter-spacing="2">YOU ART</text>
  <text x="200" y="360"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="rgba(255,255,255,0.85)"
    letter-spacing="9">LAC ROSE</text>

</svg>
